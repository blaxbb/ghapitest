name: SFTP Deploy
permissions:
  contents: read
  pull-requests: write
  deployments: write

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: 'Select the environment'
        required: true
        default: 'dev'

jobs:
  build:
    uses: ./.github/dotnet.yml
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
    env:
      SFTP_URL: ${{ secrets.SFTP_URL }}
      SSHPASS: ${{ secrets.SFTP_PASSWORD }}      
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
    steps:
    - name: Install deps
      run: sudo apt update && sudo apt install -y sshpass
    - name: Download blazor artifact
      uses: actions/download-artifact@v5
    - name: List files
      run: ls -R
    - name: Copy files
      run: sshpass -e sftp -P $SFTP_PORT -o StrictHostKeyChecking=no $SFTP_URL:/html <<< $'put -r blazor/.'