name: SFTP Deploy
permissions:
  contents: read
  pull-requests: write
  deployments: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --verbosity normal
    - name: Publish
      run: dotnet publish
    - name: Upload Directory as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blazor
        path: Blazor/bin/Release/net10.0/publish/wwwroot
    - name: Upload Directory as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: api
        path: WebAPI/bin/Release/net10.0/publish
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download blazor artifact
      uses: actions/download-artifact@v5
    - name: List files
      run: ls -R