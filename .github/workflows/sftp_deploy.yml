name: SFTP Deploy
permissions:
  contents: read
  pull-requests: write
  deployments: write

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: 'Select the environment'
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --verbosity normal
    - name: Publish
      run: dotnet publish
    - name: Upload Directory as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: blazor
        path: Blazor/bin/Release/net10.0/publish/wwwroot
    - name: Upload Directory as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: api
        path: WebAPI/bin/Release/net10.0/publish
  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      SFTP_URL: ${{ secrets.SFTP_URL }}
      SSHPASS: ${{ secrets.SFTP_PASSWORD }}      
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
    steps:
    - name: Install deps
      run: sudo apt update && sudo apt install -y sshpass
    - name: Download blazor artifact
      uses: actions/download-artifact@v5
    - name: List files
      run: ls -R
    - name: Copy files
      run: sshpass -e sftp -P $SFTP_PORT -o StrictHostKeyChecking=no $SFTP_URL:/html <<< $'put -r blazor/.'